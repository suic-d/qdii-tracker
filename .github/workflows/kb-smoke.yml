name: KB Smoke Test
on:
  push:
    paths: ['knowledge/**', '.github/workflows/kb-smoke.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 检查 knowledge/ 必需文件存在
        run: |
          for f in INDEX.md data-sources.md gotchas.md; do
            [ -f "knowledge/$f" ] || { echo "MISSING: knowledge/$f"; exit 1; }
          done
          [ -d "knowledge/adr" ] || { echo "MISSING: knowledge/adr/"; exit 1; }

      - name: 检查 AGENT.md 引用文件是否存在
        run: |
          grep -oP '(?<=`)[^`]*\.(py|md|json|yml|sh)(?=`)' AGENT.md | while read f; do
            [ -f "$f" ] || [ -d "$f" ] || echo "BROKEN_REF in AGENT.md: $f"
          done

      - name: 检查 README 引用目录是否存在
        run: |
          for d in web/ scripts/ knowledge/ .github/workflows/; do
            [ -d "$d" ] || echo "BROKEN_DIR in README: $d"
          done

      - name: 检查无 modules/ 残留引用
        run: |
          ! grep -r "knowledge/modules/" knowledge/ --include="*.md" || {
            echo "STALE_REF: knowledge/ 仍引用已删除的 modules/"
          }
